  var shape=document.getElementById('et-shape');
  var coral=document.getElementById('et-coral');
  var teal=document.getElementById('et-teal');
  var main=document.getElementById('et-main');
  var host=document.querySelector('.et-logo');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function build(t){
    var out='';
    for(var p=0;p<POLYS.length;p++){
      var pl=POLYS[p];
      for(var i=0;i<pl.length;i++){
        var x=pl[i][0],y=pl[i][1];
        var nx=x+4.5*Math.sin(y/62+0.9+t*0.9)+2*Math.sin(y/23+x/90+t*1.3);
        var ny=y+2.5*Math.sin(x/75+0.4+t*0.7);
        out+=(i?'L':'M')+nx.toFixed(1)+' '+ny.toFixed(1);
      }
      out+='Z';
    }
    return out;
  }

  var mx=0,my=0,tx=0,ty=0;
  host.addEventListener('pointermove',function(e){
    var r=host.getBoundingClientRect();
    tx=((e.clientX-r.left)/r.width-0.5)*2;
    ty=((e.clientY-r.top)/r.height-0.5)*2;
  });
  host.addEventListener('pointerleave',function(){tx=0;ty=0;});

  var glitchUntil=0,nextGlitch=2500,visible=true,raf=0,start=performance.now();
  var gj=[0,0,0,0,0,0];

  function frame(now){
    var t=(now-start)/1000;
    shape.setAttribute('d',build(t));
    mx+=(tx-mx)*0.08; my+=(ty-my)*0.08;

    var breathe=2*Math.sin(t*1.1);
    var cx=-11-breathe+mx*-8, cy=5+my*-5;
    var tex=11+breathe+mx*8,  tey=-5+my*5;
    var mxj=0,myj=0;

    if(now>=nextGlitch&&now>glitchUntil){
      glitchUntil=now+90+Math.random()*110;
      nextGlitch=now+2200+Math.random()*3800;
      for(var k=0;k<6;k++) gj[k]=(Math.random()-0.5)*2;
    }
    if(now<glitchUntil){
      cx+=gj[0]*16; cy+=gj[1]*6;
      tex+=gj[2]*16; tey+=gj[3]*6;
      mxj=gj[4]*3.5; myj=gj[5]*1.5;
    }
    coral.setAttribute('transform','translate('+cx.toFixed(1)+' '+cy.toFixed(1)+')');
    teal.setAttribute('transform','translate('+tex.toFixed(1)+' '+tey.toFixed(1)+')');
    main.setAttribute('transform','translate('+mxj.toFixed(1)+' '+myj.toFixed(1)+')');
    if(visible&&!reduce) raf=requestAnimationFrame(frame);
  }

  shape.setAttribute('d',build(0));
  coral.setAttribute('transform','translate(-11 5)');
  teal.setAttribute('transform','translate(11 -5)');
  if(reduce) return;

  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      visible=es[0].isIntersecting;
      if(visible){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
    }).observe(host);
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);}
    else if(visible){raf=requestAnimationFrame(frame);}
  });
  raf=requestAnimationFrame(frame);
})();
